<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <style>
    :root {
      --color-primary: #00f2fe;
      --color-secondary: #f093fb;
    }
    @media (prefers-color-scheme: dark) {
      /* Adjust colors if needed for dark mode, though gradients usually work well on both */
      --color-primary: #00f2fe;
      --color-secondary: #f093fb;
    }
    .bracket {
      fill: none;
      stroke: url(#gradient);
      stroke-width: 2.5;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
  </style>
  <defs>
    <linearGradient id="gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:var(--color-primary);stop-opacity:1" />
      <stop offset="100%" style="stop-color:var(--color-secondary);stop-opacity:1" />
    </linearGradient>
  </defs>
  <path class="bracket" d="M10 10l-6 6 6 6" />
  <path class="bracket" d="M22 10l6 6-6 6" />
  <path class="bracket" d="M18 7l-4 18" />
</svg>
